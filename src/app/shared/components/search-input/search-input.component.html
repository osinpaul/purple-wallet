<div class="form__control">
  <input
    class="form__input"
    [type]="type"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [(ngModel)]="value"
    (input)="onInput($any($event.target).value)" />
  <div class="form__icon">
    <img ngSrc="icons/search.svg" width="30" height="30" [alt]="type" />
  </div>
</div>
