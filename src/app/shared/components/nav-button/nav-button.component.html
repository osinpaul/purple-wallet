<button
  class="nav__button"
  appFontWeight
  fontWeight="bold"
  [ngClass]="{
    'nav__button--active': isActive,
  }"
  (click)="onClick($event)">
  @if (isActive && iconUrlActive !== null) {
    <img [ngSrc]="iconUrlActive" width="24" height="24" alt="exchange" />
  } @else {
    <img [ngSrc]="iconUrl" width="24" height="24" alt="exchange" />
  }
  <span>
    {{ text }}
  </span>
</button>
