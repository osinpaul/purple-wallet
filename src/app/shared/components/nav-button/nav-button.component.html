<button
  class="nav__button"
  [disabled]="disabled()"
  appFontWeight
  fontWeight="bold"
  [ngClass]="{
    'nav__button--active': isActive(),
  }"
  (click)="onClick($event)">
  @if (isActive() && iconUrlActive()) {
    <img
      [ngSrc]="iconUrlActive()"
      alt="navigation active icon"
      width="24"
      height="24" />
  } @else {
    <img [ngSrc]="iconUrl()" alt="navigation icon" width="24" height="24" />
  }
  {{ text() }}
</button>
