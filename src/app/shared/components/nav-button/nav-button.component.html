<button
  class="nav__button"
  [disabled]="disabled()"
  appFontWeight
  fontWeight="bold"
  [ngClass]="{
    'nav__button--active': isActive(),
  }"
  (click)="onClick($event)">
  <ng-container
    *appButtonIcon="
      isActive();
      url: iconUrl();
      activeUrl: iconUrlActive();
      let src
    ">
    <img [ngSrc]="src" width="24" height="24" alt="exchange" />
  </ng-container>
  {{ text() }}
</button>
